name: Refactor gate tooling

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  offline-gates:
    name: Offline gate tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test contract runner
        run: python -B -m unittest discover -s scripts/refactor -p "test_*.py"

      - name: Test live evidence validation
        run: python -B -m unittest discover -s scripts/refactor/live -p "test_*.py"

      - name: Test accepted CLI capture
        run: python -B -m unittest discover -s scripts/refactor/capture -p "test_*.py"

      - name: Set up Node for broker tests
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test isolated harness preparation
        run: python -B -m unittest discover -s scripts/refactor/harness -p "test_*.py"

      - name: Test authored harness profiles
        run: python -B -m unittest discover -s scripts/refactor/harness/tests -p "test_*.py"

      - name: Test exact Windows worker and relay
        run: python -B -m unittest discover -s scripts/g9 -p "test_*.py"

      - name: Test authored harness brokers
        run: >-
          node --test
          scripts/refactor/harness/tests/job_broker.test.cjs
          scripts/refactor/harness/tests/mutation_site_broker.test.cjs
          scripts/refactor/harness/tests/policy_broker.test.cjs
          scripts/refactor/harness/tests/policy_install_broker.test.cjs
          scripts/refactor/harness/tests/credential_broker.test.cjs
          scripts/g9/tests/windows_installer_broker.test.cjs
