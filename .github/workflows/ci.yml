name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  native-policy:
    name: Native managed policy gates
    uses: ./.github/workflows/native-policy.yml

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo "$files"
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Run race tests
        run: go test -race ./...

      - name: Run bounded TOON fuzz tests
        shell: bash
        run: |
          go test ./internal/toon -run='^$' -fuzz=FuzzEncodeDecodeStrings -fuzztime=5s
          go test ./internal/toon -run='^$' -fuzz=FuzzDecodeNeverPanics -fuzztime=5s
          go test ./internal/toon -run='^$' -fuzz=FuzzJSONRoundTrip -fuzztime=5s

      - name: Check module metadata
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check generated files
        shell: bash
        run: |
          go generate ./...
          go run ./cmd/gencapdocs -out docs/reference/capabilities.md
          git diff --exit-code

      - name: Test shell installer
        shell: bash
        run: |
          bash -n scripts/install.sh scripts/tests/install_sh_test.sh
          bash scripts/tests/install_sh_test.sh

      - name: Test static website packaging
        run: node --test scripts/tests/site_test.mjs

      - name: Test exploration launcher offline
        run: node --test .agents/skills/tadx-explore/scripts/explore.test.mjs

  windows-quality:
    name: Windows quality gates
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: pwsh
        run: |
          $files = gofmt -l .
          if ($files) {
            $files
            exit 1
          }

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Run race tests
        run: go test -race ./...

      - name: Check module metadata
        shell: pwsh
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check generated files
        shell: pwsh
        run: |
          go generate ./...
          go run ./cmd/gencapdocs -out docs/reference/capabilities.md
          git diff --exit-code

      - name: Check PowerShell installer syntax
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/install.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String
            exit 1
          }

      - name: Test PowerShell 7 installer
        shell: pwsh
        run: ./scripts/tests/install_ps1_test.ps1

      - name: Test Windows PowerShell 5.1 installer
        shell: powershell
        run: ./scripts/tests/install_ps1_test.ps1

      - name: Test exploration launcher offline
        run: node --test .agents/skills/tadx-explore/scripts/explore.test.mjs

  cross-compile:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            suffix: .exe
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: arm64
            suffix: ""
          - goos: linux
            goarch: amd64
            suffix: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build primary binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o "${RUNNER_TEMP}/tadx-${GOOS}-${GOARCH}${{ matrix.suffix }}" ./cmd/tadx
