<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2090 1130" role="img" aria-labelledby="title desc">
<title id="title">TADX: the main parts</title>
<desc id="desc">Command handling, isolated actions, remote adapters, Tableau clients, local state, and structured output, with a numbered source-file legend.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#315ca8"/></marker><marker id="wiring" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6840b7"/></marker></defs>
<rect width="2090" height="1130" fill="#f3f5f7"/>
<text x="32" y="57" font-family="Arial, sans-serif" font-size="32" fill="#0b2538"><tspan x="32" dy="0">TADX: the main parts</tspan></text>
<text x="32" y="92" font-family="Arial, sans-serif" font-size="19" fill="#5e6b78"><tspan x="32" dy="0">Read the center first. Follow the left branch for Tableau and the right branch for local state.</tspan></text>
<rect x="510" y="120" width="340" height="95" rx="12" fill="#d9f3ec" stroke="#b9c5ce"/>
<text x="528" y="158" font-family="Arial, sans-serif" font-size="22" fill="#0b2538"><tspan x="528" dy="0">1  You or your agent</tspan></text>
<text x="528" y="192" font-family="Arial, sans-serif" font-size="17" fill="#465666"><tspan x="528" dy="0">A command + optional skills.</tspan></text>
<rect x="510" y="265" width="340" height="130" rx="12" fill="#ffffff" stroke="#b9c5ce"/>
<text x="528" y="303" font-family="Arial, sans-serif" font-size="22" fill="#0b2538"><tspan x="528" dy="0">2  Command surface</tspan></text>
<text x="528" y="337" font-family="Arial, sans-serif" font-size="17" fill="#465666"><tspan x="528" dy="0">Parse verbs and flags.</tspan><tspan x="528" dy="21.25">Apply preview and mutation policy.</tspan></text>
<rect x="40" y="265" width="340" height="130" rx="12" fill="#ede5ff" stroke="#b9c5ce"/>
<text x="58" y="303" font-family="Arial, sans-serif" font-size="22" fill="#0b2538"><tspan x="58" dy="0">3  Capability registry</tspan></text>
<text x="58" y="337" font-family="Arial, sans-serif" font-size="17" fill="#465666"><tspan x="58" dy="0">Describe available operations.</tspan><tspan x="58" dy="21.25">Validate command bindings.</tspan><tspan x="58" dy="21.25">Generate reference data.</tspan></text>
<rect x="980" y="265" width="340" height="130" rx="12" fill="#ede5ff" stroke="#b9c5ce"/>
<text x="998" y="303" font-family="Arial, sans-serif" font-size="22" fill="#0b2538"><tspan x="998" dy="0">4  Composition root</tspan></text>
<text x="998" y="337" font-family="Arial, sans-serif" font-size="17" fill="#465666"><tspan x="998" dy="0">Select target, workspace, read source.</tspan><tspan x="998" dy="21.25">Supply dependencies per command.</tspan></text>
<rect x="510" y="470" width="340" height="155" rx="12" fill="#d9f3ec" stroke="#b9c5ce"/>
<text x="528" y="508" font-family="Arial, sans-serif" font-size="22" fill="#0b2538"><tspan x="528" dy="0">5  One action per operation</tspan></text>
<text x="528" y="542" font-family="Arial, sans-serif" font-size="17" fill="#465666"><tspan x="528" dy="0">Validate and perform one operation.</tspan><tspan x="528" dy="21.25">Call narrow interfaces, not HTTP.</tspan></text>
<rect x="40" y="470" width="340" height="155" rx="12" fill="#e2ebfb" stroke="#b9c5ce"/>
<text x="58" y="508" font-family="Arial, sans-serif" font-size="22" fill="#0b2538"><tspan x="58" dy="0">6  Resource adapters</tspan></text>
<text x="58" y="542" font-family="Arial, sans-serif" font-size="17" fill="#465666"><tspan x="58" dy="0">Resolve exact content identities.</tspan><tspan x="58" dy="21.25">Normalize resource reads.</tspan></text>
<rect x="980" y="470" width="340" height="155" rx="12" fill="#e2ebfb" stroke="#b9c5ce"/>
<text x="998" y="508" font-family="Arial, sans-serif" font-size="22" fill="#0b2538"><tspan x="998" dy="0">7  Local adapters</tspan></text>
<text x="998" y="542" font-family="Arial, sans-serif" font-size="17" fill="#465666"><tspan x="998" dy="0">Bridge action interfaces to</tspan><tspan x="998" dy="21.25">workspace, artifact, and cache code.</tspan></text>
<rect x="40" y="695" width="340" height="150" rx="12" fill="#e2ebfb" stroke="#b9c5ce"/>
<text x="58" y="733" font-family="Arial, sans-serif" font-size="22" fill="#0b2538"><tspan x="58" dy="0">8  Tableau clients + auth</tspan></text>
<text x="58" y="767" font-family="Arial, sans-serif" font-size="17" fill="#465666"><tspan x="58" dy="0">REST, Metadata, VDS, Pulse.</tspan><tspan x="58" dy="21.25">Reuse sessions within a command.</tspan><tspan x="58" dy="21.25">Bound requests and redact secrets.</tspan></text>
<rect x="510" y="695" width="340" height="150" rx="12" fill="#d9f3ec" stroke="#b9c5ce"/>
<text x="528" y="733" font-family="Arial, sans-serif" font-size="22" fill="#0b2538"><tspan x="528" dy="0">9  Structured result</tspan></text>
<text x="528" y="767" font-family="Arial, sans-serif" font-size="17" fill="#465666"><tspan x="528" dy="0">Compact TOON or --full.</tspan><tspan x="528" dy="21.25">Preserve warnings and partial results.</tspan></text>
<rect x="980" y="695" width="340" height="150" rx="12" fill="#e2ebfb" stroke="#b9c5ce"/>
<text x="998" y="733" font-family="Arial, sans-serif" font-size="22" fill="#0b2538"><tspan x="998" dy="0">10  Local state</tspan></text>
<text x="998" y="767" font-family="Arial, sans-serif" font-size="17" fill="#465666"><tspan x="998" dy="0">Workspaces: native files + metadata</tspan><tspan x="998" dy="21.25">SQLite: cached observations</tspan><tspan x="998" dy="21.25">Config: targets and references</tspan><tspan x="998" dy="21.25">Native OS store: approved PATs</tspan></text>
<rect x="40" y="915" width="340" height="95" rx="12" fill="#0b2538" stroke="#b9c5ce"/>
<text x="58" y="951" font-family="Arial, sans-serif" font-size="20" fill="#ffffff"><tspan x="58" dy="0">11  Tableau Cloud / Server</tspan></text>
<text x="58" y="987" font-family="Arial, sans-serif" font-size="17" fill="#ffffff"><tspan x="58" dy="0">Remote reads and enabled mutations</tspan></text>
<text x="510" y="943" font-family="Arial, sans-serif" font-size="23" fill="#0b2538"><tspan x="510" dy="0">Live by default. Local when requested.</tspan></text>
<text x="510" y="978" font-family="Arial, sans-serif" font-size="18" fill="#5e6b78"><tspan x="510" dy="0">Supported --catalog reads use SQLite only, without live fallback.</tspan><tspan x="510" dy="22.5">One command owns its runtime; TADX has no resident service.</tspan><tspan x="510" dy="22.5">Tableau MCP remains separate. TADX does not proxy it.</tspan></text>
<polyline points="680,215 680,265" fill="none" stroke="#315ca8" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="380,330 510,330" fill="none" stroke="#6840b7" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#wiring)"/>
<polyline points="980,350 920,350 920,485 850,485" fill="none" stroke="#6840b7" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#wiring)"/>
<polyline points="680,395 680,470" fill="none" stroke="#315ca8" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="510,545 380,545" fill="none" stroke="#315ca8" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="850,565 980,565" fill="none" stroke="#315ca8" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="210,625 210,695" fill="none" stroke="#315ca8" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1150,625 1150,695" fill="none" stroke="#315ca8" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="680,625 680,695" fill="none" stroke="#315ca8" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="210,845 210,915" fill="none" stroke="#315ca8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="32" y="1077" font-family="Arial, sans-serif" font-size="17" fill="#5e6b78"><tspan x="32" dy="0">Solid arrows: simplified runtime flow (returns omitted).   Dashed arrows: metadata and dependency wiring.</tspan></text>
<text x="32" y="1105" font-family="Arial, sans-serif" font-size="17" fill="#5e6b78"><tspan x="32" dy="0">Actions depend on interfaces. The composition root supplies implementations; this is not a Go import graph.</tspan></text>
<rect x="1390" y="22" width="660" height="1075" rx="12" fill="#ffffff" stroke="#d8e0e6"/>
<text x="1415" y="70" font-family="Arial, sans-serif" font-size="28" fill="#0b2538"><tspan x="1415" dy="0">Source references</tspan></text>
<text x="1415" y="103" font-family="Arial, sans-serif" font-size="17" fill="#465666"><tspan x="1415" dy="0">Numbers match the diagram. Paths are relative to the repo.</tspan><tspan x="1415" dy="21.25">Linked paths open the corresponding file on GitHub main.</tspan></text>
